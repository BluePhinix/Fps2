<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover extends the canvas under the notch / home indicator;
         user-scalable=no + maximum-scale stop Android double-tap zoom. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05010d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cyber Strike" />
    <meta name="description" content="Cyber Strike — a browser FPS that runs on desktop and mobile." />
    <!-- Inline SVG favicon: avoids a 404 round trip on every load. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305010d'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2305d9e8' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ff2a6d'/%3E%3C/svg%3E"
    />
    <title>Cyber Strike FPS - Arena Combat</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown only to touch devices held in portrait. -->
    <div class="rotate-hint">
      <div style="font-size: 34px">⟳</div>
      <div>Rotate your device</div>
      <div style="font-size: 10px; opacity: 0.6">Cyber Strike plays in landscape</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
